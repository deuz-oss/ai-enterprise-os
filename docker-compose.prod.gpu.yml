# Override STT untuk server dengan GPU NVIDIA (butuh NVIDIA Container Toolkit):
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.gpu.yml \
#     --profile voice up -d
# Di CPU, jeda agen setelah kandidat selesai bicara ~10 dtk (uji 2026-09-26);
# GPU menurunkannya ke kisaran 1-2 dtk dan memungkinkan model whisper lebih
# besar (STT_MODEL, mis. Systran/faster-whisper-large-v3) untuk akurasi
# Bahasa Indonesia yang lebih baik.
# CATATAN: belum diuji di mesin GPU (mesin dev tidak punya GPU).

services:
  stt-server:
    image: fedirz/faster-whisper-server:latest-cuda
    environment:
      WHISPER__COMPUTE_TYPE: "${STT_COMPUTE_TYPE:-float16}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

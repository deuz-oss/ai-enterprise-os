name: ai-enterprise-os-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Role aplikasi terpisah (RLS efektif karena bukan pemilik tabel)
      APP_DB_USER: ${APP_DB_USER:-aeos_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/pg:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Tidak ada ports: hanya reachable di dalam jaringan compose.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      # Runtime memakai role terbatas aeos_app (RLS berlaku);
      # migrasi memakai role pemilik skema via ALEMBIC_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-aeos_app}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ALEMBIC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_ENDPOINT: http://minio:9000
      # Link unduhan (presigned URL) harus ditandatangani dgn host yang bisa
      # dibuka browser -- minio:9000 hanya ada di jaringan Docker. Caddy
      # meneruskan files.<DOMAIN> ke MinIO (lihat deploy/Caddyfile).
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-https://files.${DOMAIN}}
      # Interview suara (profile "voice"): URL LiveKit untuk BROWSER kandidat.
      # Fitur tetap nonaktif selama LIVEKIT_URL (.env.production) kosong.
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://livekit.${DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)\""]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - minio
    logging: *logging

  # ---- Interview suara AI (opsional) ----
  # TIDAK ikut `docker compose up` biasa; aktifkan dengan
  #   docker compose -f docker-compose.prod.yml --profile voice up -d
  # Prasyarat (DNS livekit.<DOMAIN>, port firewall, variabel .env.production)
  # di docs/DEPLOYMENT.md bagian "Interview suara". Server dengan GPU:
  # tambahkan -f docker-compose.prod.gpu.yml untuk STT.

  livekit:
    image: livekit/livekit-server:v1.10.0
    profiles: ["voice"]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    # Sinyal (7880) TIDAK dipublikasikan: lewat Caddy (wss://livekit.<DOMAIN>).
    # Media WebRTC & TURN harus langsung ke server.
    ports:
      - "7881:7881" # WebRTC TCP (cadangan bila UDP diblokir)
      - "50000-50100:50000-50100/udp" # media WebRTC
      - "3478:3478/udp" # TURN
      - "40000-40100:40000-40100/udp" # relai TURN
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *logging

  stt-server:
    # Default CPU (jalan di server mana pun). Server GPU: override
    # docker-compose.prod.gpu.yml (image CUDA + float16).
    image: fedirz/faster-whisper-server:latest-cpu
    profiles: ["voice"]
    restart: unless-stopped
    environment:
      WHISPER__MODEL: "${STT_MODEL:-Systran/faster-whisper-small}"
      # Model tetap dimuat (default melepas saat idle 5 menit lalu memuat
      # ulang puluhan detik -> jawaban pertama melewati batas STT agen).
      WHISPER__TTL: "-1"
      WHISPER__COMPUTE_TYPE: "${STT_COMPUTE_TYPE:-int8}"
    volumes:
      - stt_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    logging: *logging

  ai-interview-agent:
    build: ./agent
    profiles: ["voice"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
      # Agen tersambung ke LiveKit lewat jaringan internal compose.
      LIVEKIT_URL: ws://livekit:7880
      STT_BASE_URL: http://stt-server:8000/v1
    depends_on:
      livekit:
        condition: service_healthy
      stt-server:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  minio:
  caddy_data:
  caddy_config:
  stt_model_cache:

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["frontend", "docs", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: pola Depends() di default argumen adalah standar FastAPI
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
# Santai untuk scaffolding awal; ketatkan bertahap saat codebase matang:
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["frontend", "docs", "tools", "backend/alembic"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["backend"]

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Versi persis = yang dipakai image produksi (backend/requirements*.lock).
          pip install -r backend/requirements-dev.lock
          pip install --no-deps -e backend

      - name: Lint (ruff)
        run: ruff check backend

      - name: Type check (mypy)
        run: mypy backend/app

      - name: Tests (pytest)
        run: pytest -q
        env:
          APP_ENV: test
          SECRET_KEY: ci-secret-key-for-testing-only-0123456789abcdef

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Build & type check
        working-directory: frontend
        run: npm run build

  # Agen interview suara + avatar video PoC. Tiap komponen punya lock sendiri
  # (livekit-agents dikunci 1.7.1) -- avatar.py memakai kelas privat
  # LiveKit, tes agent memastikan import-nya masih ada.
  voice:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [agent, avatar-worker]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.lock ]; then
            pip install -r requirements-dev.lock
          else
            # agent/ belum punya lock dev; pytest saja di atas lock runtime.
            pip install -r requirements.lock pytest
          fi
          pip install --no-deps .

      - name: Tests (pytest)
        run: python -m pytest tests -q

  # Gerbang lisensi FlashHead (varian lite = riset saja). Tanpa torch/GPU;
  # image flashhead-server sendiri (CUDA, belasan GB) tidak dibangun di CI.
  flashhead-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (pytest)
        run: |
          pip install pytest
          python -m pytest flashhead-server/tests -q -p no:cacheprovider

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, voice]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, agent, avatar-worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-enterprise-os/${{ matrix.component }}:ci ./${{ matrix.component }}

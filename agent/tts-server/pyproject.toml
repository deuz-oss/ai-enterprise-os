[project]
name = "aeos-tts-mms-id"
version = "0.1.0"
description = "Wrapper OpenAI-compatible /v1/audio/speech di sekitar facebook/mms-tts-ind (self-hosted TTS Bahasa Indonesia -- Kokoro TIDAK dipakai, tidak dukung Indonesia)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "transformers>=4.33.0",
  "torch>=2.2.0",
  "scipy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

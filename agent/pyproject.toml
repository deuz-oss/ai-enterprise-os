[project]
name = "aeos-ai-interview-agent"
version = "0.1.0"
description = "AI Interview Fase 2 -- LiveKit voice agent worker (self-hosted STT/TTS, LLM reuse dari backend)"
requires-python = ">=3.12"
dependencies = [
  "livekit-agents>=1.0.0",
  "livekit-plugins-openai>=1.0.0",
  "livekit-plugins-silero>=1.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

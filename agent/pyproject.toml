[project]
name = "aeos-ai-interview-agent"
version = "0.1.0"
description = "AI Interview Fase 2 -- LiveKit voice agent worker (self-hosted STT/TTS, LLM reuse dari backend)"
requires-python = ">=3.12"
dependencies = [
  # Dipin ke 1.7.x: API turn handling (`turn_handling={...}`) dan turn
  # detector lokal `inference.TurnDetector(version="v1-mini")` ada di 1.7.
  "livekit-agents~=1.7.1",
  "livekit-plugins-openai~=1.7.1",
  "livekit-plugins-silero~=1.7.1",
  "httpx>=0.27.0",
]

# Eksplisit: flat layout dengan >1 modul membuat auto-discovery setuptools
# gagal ("Multiple top-level modules discovered").
[tool.setuptools]
py-modules = ["main", "interview_flow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

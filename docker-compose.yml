name: ai-enterprise-os

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:80"

  # ---- AI Interview Fase 2: percakapan suara real-time ----
  # (PRD "Berikutnya" §5) -- TIDAK start dengan `docker compose up` biasa,
  # butuh eksplisit `docker compose --profile voice up`. GPU direkomendasikan
  # untuk stt-server (latensi rendah); tanpa GPU tetap jalan di CPU untuk
  # verifikasi wiring, jauh lebih lambat dari real-time. TTS lewat OpenAI
  # (AI_BASE_URL) -- facebook/mms-tts-ind self-hosted dicoba lebih dulu tapi
  # kualitas suaranya jelek, lihat catatan di agent/main.py.

  livekit:
    image: livekit/livekit-server:v1.10.0
    profiles: ["voice"]
    command: ["--dev", "--bind", "0.0.0.0"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_PORT_RANGE_START: "51000"
      LIVEKIT_RTC_PORT_RANGE_END: "51020"
    ports:
      - "7880:7880" # HTTP/WebSocket (client & server API)
      - "7881:7881" # WebRTC TCP fallback
      - "51000-51020:51000-51020/udp" # media WebRTC (range kecil, hindari bentrok port dinamis app lain spt Teams; sesuaikan di mesin lain kalau masih bentrok)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 6

  stt-server:
    image: fedirz/faster-whisper-server:latest-cpu
    profiles: ["voice"]
    environment:
      WHISPER__MODEL: "${STT_MODEL:-Systran/faster-whisper-small}"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - stt_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  ai-interview-agent:
    build: ./agent
    profiles: ["voice"]
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      STT_BASE_URL: http://stt-server:8000/v1
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TTS_MODEL: ${AI_TTS_MODEL:-gpt-4o-mini-tts}
      AI_TTS_VOICE: ${AI_TTS_VOICE:-ash}
    depends_on:
      livekit:
        condition: service_healthy
      stt-server:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  pgdata:
  minio:
  stt_model_cache:

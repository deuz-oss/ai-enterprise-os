server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Unggahan dokumen (CV/kontrak) melewati origin ini — batas 25 MB
    # selaras validasi backend.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API di-proxy ke backend sehingga frontend & API satu origin
    # (tanpa isu CORS; VITE_API_URL=/api/v1 saat build).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # panggilan LLM bisa lama
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

[project]
name = "aeos-backend"
version = "0.2.0"
description = "AI Enterprise OS - outsourcing operations platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "email-validator>=2.2.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "pyjwt>=2.9.0",
  "passlib>=1.7.4",
  "python-multipart>=0.0.9",
  "boto3>=1.35.0",
  "httpx>=0.27.0",
  "pypdf>=4.3.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "reportlab>=4.2.0",
  "livekit-api>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
